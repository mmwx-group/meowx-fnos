# 网络权限靠这里拿：宿主网络 + NET_ADMIN + /dev/net/tun（飞牛只让官方合作开发者发 root 应用，社群的 Tailscale fpk 也是这么做的）。
# 镜像在 NAS 上就地构建（见 Dockerfile），不从镜像仓库拉。
services:
  meowx:
    build:
      context: .
      dockerfile: Dockerfile
    image: meowx-fnos:__VERSION__
    pull_policy: build
    container_name: meowx
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - MEOWX_UI_PORT=7899
      - TZ=Asia/Shanghai
      # 一键更新：应用中心按宿主路径读下载好的安装包
      - MEOWX_HOST_DATA=${TRIM_PKGVAR:?}/data
    volumes:
      - ${TRIM_PKGVAR:?}/data:/data
      # 飞牛应用中心的接口（只有 root 与官方应用组能连）：一键更新经它原地升级，同网页「手动安装」
      - /run/com.trim.app.center.sock:/run/fnos-appcenter.sock
      - /etc/ssl/certs:/etc/ssl/certs:ro   # 用宿主的 CA 证书（随飞牛系统更新），镜像里不另带
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    restart: unless-stopped
